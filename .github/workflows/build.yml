name: Build Xeno Vulkan Wrapper (B-Easy)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            ..

      - name: Build .so
        run: |
          cd build
          cmake --build . --config Release -- -j8

      - name: Prepare output
        run: |
          mkdir -p output
          cp build/libvulkan.xeno_wrapper.so output/libvulkan.xeno_wrapper.so
          cp meta.json output/meta.json

      - name: Create ZIP
        run: |
          cd output
          zip xeno_wrapper.zip libvulkan.xeno_wrapper.so meta.json

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan.xeno_wrapper
          path: output/libvulkan.xeno_wrapper.so

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: xeno_wrapper_zip
          path: output/xeno_wrapper.zip
