name: Build Xeno Vulkan Wrapper

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build ARM64 Vulkan Wrapper (B-Easy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Android NDK
        uses: android-actions/setup-ndk@v3
        with:
          ndk-version: r26d

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release -- -j8

      - name: Copy output library
        run: |
          mkdir -p output
          cp build/libvulkan.xeno_wrapper.so output/libvulkan.xeno_wrapper.so
          cp meta.json output/meta.json

      - name: Create ZIP for Eden
        run: |
          cd output
          zip xeno_wrapper.zip libvulkan.xeno_wrapper.so meta.json

      - name: Upload .so file
        uses: actions/upload-artifact@v3
        with:
          name: libvulkan.xeno_wrapper
          path: output/libvulkan.xeno_wrapper.so

      - name: Upload Eden ZIP
        uses: actions/upload-artifact@v3
        with:
          name: xeno_wrapper_zip
          path: output/xeno_wrapper.zip
